<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שאלון אנגלית · האזנה</title>
  <link rel="stylesheet" href="../ds/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-group="listen-words" data-prev="frame.html" data-next="frame3.html">

  <!-- Figma frame "שאלון אנגלית 2" (594:8358): listen to the word (the speaker button) and choose it -->
  <div class="wz-frame wz-fr">
    <main class="wz-canvas">
      <section class="wz-card" aria-labelledby="fr-title">

        <header class="wz-head">
          <h1 class="wz-title" id="fr-title">שאלון אנגלית</h1>
          <button class="ds-btn ds-btn-lg ds-btn-secondary ds-btn-borderless ds-btn-icon" type="button" aria-label="סגירה" data-toast="היציאה מהשאלון תופיע כאן">
            <ds-icon name="clear"></ds-icon>
          </button>
        </header>

        <nav class="wz-stepper-nav" aria-label="שלבי השאלון">
          <ol class="wz-stepper" id="stepper"></ol>
        </nav>

        <div class="wz-fr-question wz-fr-question-listen">
          <div class="wz-fr-listen">
            <div class="wz-fr-panel">
              <div class="wz-fr-heading">
                <h2 class="wz-fr-title" id="statement" lang="en" dir="ltr">Listen to the word and choose the correct answer</h2>
                <p class="wz-fr-sub">האזינו למילה ובחרו את התשובה הנכונה</p>
              </div>

              <!-- Audio Player Component from Figma (Node 7562:40332) -->
              <div class="wz-fr-audio-player">
                <p class="wz-fr-audio-prompt">לחיצה על הכפתור להאזנה</p>
                <div class="wz-fr-audio-pill" dir="ltr">
                  <div class="wz-fr-audio-info">
                    <span class="wz-fr-audio-time" id="audio-time">0:15</span>
                    <div class="wz-fr-audio-track" id="audio-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                      <div class="wz-fr-audio-fill" id="audio-fill"></div>
                    </div>
                  </div>
                  <button class="wz-fr-audio-play-btn" type="button" id="play" aria-label="השמעת ההקלטה">
                    <ds-icon name="play" size="20" id="play-icon"></ds-icon>
                  </button>
                </div>
              </div>

              <div class="wz-fr-words" id="answer" role="radiogroup" aria-labelledby="statement" dir="ltr"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="wz-bar">
      <button class="ds-btn ds-btn-xl wz-btn-translucent wz-fr-prev" type="button" id="prev">
        <ds-icon name="arrow-right"></ds-icon>
        <span>הקודם</span>
      </button>
      <p class="wz-fr-count" id="count" aria-live="polite"></p>
      <div class="wz-fr-actions">
        <button class="ds-btn ds-btn-xl ds-btn-primary wz-next" type="button" id="next">
          <span id="next-label">שאלה הבאה</span>
          <ds-icon name="arrow-left"></ds-icon>
        </button>
      </div>
    </footer>
  </div>

  <script src="../ds/ds-icons.js"></script>
  <script src="../ds/ds.js"></script>
  <script src="data.js"></script>
  <script src="frame-shared.js"></script>
  <script src="frame-questions.js"></script>
</body>
</html>
